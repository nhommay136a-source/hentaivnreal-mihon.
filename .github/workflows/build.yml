name: Build HentaiVNReal extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Keiyoushi build system
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream

      - name: Checkout this extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Copy extension module into build system
        run: |
          mkdir -p upstream/src/vi
          cp -R extension/src/vi/hentaivnreal upstream/src/vi/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Format and build APK
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :src:vi:hentaivnreal:spotlessApply --no-daemon 2>&1 | tee build.log
          ./gradlew :src:vi:hentaivnreal:assembleRelease --no-daemon --stacktrace --info 2>&1 | tee -a build.log

      - name: Print Kotlin compiler diagnostics
        if: failure()
        working-directory: upstream
        run: |
          {
            echo "## Kotlin/build diagnostics"
            echo '```text'
            grep -E '(^e: |\\.kt:[0-9]+:[0-9]+:|Unresolved reference|overrides nothing|Type mismatch|Compilation error|What went wrong)' build.log | tail -n 100 || tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save failed build log to repository
        if: failure()
        working-directory: extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          if [ -f ../upstream/build.log ]; then
            cp ../upstream/build.log diagnostics/latest-build.log
          else
            echo "Build log was not created." > diagnostics/latest-build.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/latest-build.log
          git commit -m "Save latest failed build diagnostics" || exit 0
          git push

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hentaivnreal-build-log
          path: upstream/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hentaivnreal-mihon-apk
          path: upstream/src/vi/hentaivnreal/build/outputs/apk/release/*.apk
          if-no-files-found: error
